name: SLSA Level 3 Provenance Generator

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package Application Artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf release.tar.gz app.js package.json package-lock.json

      - name: Generate SHA256 Checksum for SLSA
        shell: bash
        id: hash
        run: |
          echo "hashes=$(sha256sum release.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum release.tar.gz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact
          path: release.tar.gz
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # required by generator's refs/tags/vX.Y.Z validation
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      private-repository: true
