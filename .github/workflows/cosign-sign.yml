name: Keyless Artifact Signing with Cosign

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package Release Artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -czf release.tar.gz app.js package.json package-lock.json
          sha256sum release.tar.gz > release.tar.gz.sha256
          ls -lh release.tar.gz release.tar.gz.sha256

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Artifact Keylessly
        shell: bash
        run: |
          set -euo pipefail
          cosign version
          cosign sign-blob release.tar.gz --bundle release.tar.gz.sigstore.json --yes
          test -s release.tar.gz.sigstore.json
          # Extract inspection files from the signed Sigstore bundle.
          jq -er '.messageSignature.signature' release.tar.gz.sigstore.json > release.tar.gz.sig
          jq -er '.verificationMaterial.certificate.rawBytes' release.tar.gz.sigstore.json | base64 -d | openssl x509 -inform DER -outform PEM > release.tar.gz.pem
          test -s release.tar.gz.sig
          openssl x509 -in release.tar.gz.pem -noout -subject -issuer

      - name: Verify Signed Artifact
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          echo "Expected certificate identity: $identity"
          cosign verify-blob release.tar.gz \
            --bundle release.tar.gz.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          sha256sum -c release.tar.gz.sha256
          echo "Verified OK: signature, OIDC identity and SHA256 checksum"

      - name: Upload Signed Artifacts Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed-package
          path: |
            release.tar.gz
            release.tar.gz.sig
            release.tar.gz.pem
            release.tar.gz.sha256
            release.tar.gz.sigstore.json
          if-no-files-found: error
